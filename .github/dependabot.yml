version: 2
updates:
  # npm-зависимости приложения
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Gradle-зависимости Android-проекта
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # capacitor-cordova-android-plugins — генерируемый модуль (cap sync):
    # его версии управляет Capacitor, ручные бампы ломают сборку
    ignore:
      - dependency-name: "com.google.gms:google-services"

  # GitHub Actions (безопасность supply-chain: обновляем и пиним по SHA)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
