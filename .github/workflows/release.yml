# HumNote release: тег v* → подписанный APK + web-архив → единый GitHub Release.
#
# Приложение САМОДОСТАТОЧНОЕ (запись, распознавание, синтез и экспорт работают
# на устройстве, сервера нет):
#   - web-package:  статический сайт (out/) в zip — развернуть на любом хостинге;
#   - android:      подписанный APK (ключ из Secrets, SHA-пин, сверка сертификата).
#
# Примечания к релизу = секция версии из CHANGELOG.md: тег v1.0.0 → «## [1.0.0]».
# Гейт проверяет наличие секции ДО сборок; затем секция склеивается с описанием
# артефактов и публикуется как тело релиза (generate_release_notes добавит
# «Full Changelog» в конец автоматически).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── общая статическая сборка ────────────────────────────────────────────────
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Зависимости
        run: bun install --frozen-lockfile

      - name: "Гейт: версия в package.json = тегу"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "✗ тег '$TAG' не vX.Y.Z"; exit 1 ;; esac
          VER="${TAG#v}"
          PKGVER=$(node -p "require('./package.json').version")
          test "$PKGVER" = "$VER" || { echo "✗ версия package.json ($PKGVER) != тегу ($VER) — бампни версию и переметь тег"; exit 1; }

      - name: "Гейт: CHANGELOG.md содержит секцию версии"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          grep -Eq "^## \[$VER\]" CHANGELOG.md || {
            echo "✗ в CHANGELOG.md нет секции '## [$VER]' — примечания релиза берутся из неё (см. политику в шапке CHANGELOG.md)"; exit 1;
          }
          echo "✓ секция [$VER] найдена"

      - name: "Статическая сборка (output: export)"
        run: bunx next build

      - name: Проверка результата
        run: test -f out/index.html || { echo "✗ нет out/index.html"; exit 1; }

      - name: Кэш статики для остальных джоб
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out
          key: humnote-static-${{ github.sha }}

  # ── web: zip для развёртывания на любом статическом хостинге ───────────────
  web-package:
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Восстановить статическую сборку
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out
          key: humnote-static-${{ github.sha }}

      - name: zip + tar.gz
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          cd out
          zip -qr "../HumNote-${VER}-web.zip" .
          tar -czf "../HumNote-${VER}-web.tar.gz" .
          cd ..
          sha256sum HumNote-${VER}-web.* > SHA256SUMS-web.txt
          cat SHA256SUMS-web.txt

      - name: Артефакт
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-package
          path: |
            HumNote-*-web.zip
            HumNote-*-web.tar.gz
            SHA256SUMS-web.txt
          if-no-files-found: error

  # ── Android: подписанный APK (ключ из Secrets, SHA-пин) ────────────────────
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Зависимости
        run: bun install --frozen-lockfile

      # ── КЛЮЧ ПОДПИСИ: только из Secrets, SHA-пин. Ключ НИКОГДА не генерируем
      # заново: новый ключ = невозможно обновиться поверх установленного APK.
      - name: Ключ подписи из Secrets + сверка SHA-256 пина
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_SHA256: a4e6f3b4bb07b80080d2e8835a2c8b39c24f9ade5f4a0a941c335ef82c20757b
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "✗ секреты подписи не заданы: KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/humnote-upload.jks"
          ACTUAL=$(sha256sum "$RUNNER_TEMP/humnote-upload.jks" | cut -d' ' -f1)
          echo "SHA-256 ключа из секрета: $ACTUAL"
          if [ "$ACTUAL" != "$KEYSTORE_SHA256" ]; then
            echo "✗ SHA-256 ключа НЕ совпал с мастер-пином: секрет подменён или испорчен. Сборка остановлена."
            exit 1
          fi
          {
            echo "storeFile=$RUNNER_TEMP/humnote-upload.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/keystore.properties

      - name: "Версия APK = тегу (versionName), versionCode = номеру прогона (монотонно)"
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          CODE="${GITHUB_RUN_NUMBER}"
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VER\"/" android/app/build.gradle
          echo "versionCode=$CODE, versionName=$VER"

      - name: Статическая сборка web
        run: bunx next build

      - name: capacitor sync (out/ → android assets, приложение офлайн)
        run: bunx cap sync android

      - name: Сборка подписанного APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: "Проверка подписи: сертификат должен совпадать со стабильным"
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "✗ APK не собран"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          CERT_SHA=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/certs.txt | head -1)
          echo "Сертификат подписи (SHA-256): $CERT_SHA"
          # Отпечаток сверяется с тем, что заявлен в README (открытая константа —
          # пользователь сверяет APK по нему): подмена ключа в Secrets ломает
          # сборку, а не тихо подписывает APK чужим ключом.
          EXPECTED="072d73ddcefce9668bb3814c31610f43aa9b28495b469b3c8c71771976d39f1d"
          if [ "$(echo "$CERT_SHA" | tr 'A-F' 'a-f')" != "$EXPECTED" ]; then
            echo "✗ сертификат APK ($CERT_SHA) не совпал с заявленным в README ($EXPECTED)"
            exit 1
          fi

      - name: Переименовать артефакт
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "HumNote-${VER}-android.apk"
          sha256sum "HumNote-${VER}-android.apk"

      - name: Артефакт
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: HumNote-*-android.apk
          if-no-files-found: error

  # ── публикация единого релиза ───────────────────────────────────────────────
  release:
    needs: [web-package, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Извлечь секцию версии из CHANGELOG.md
        env:
          VER: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${VER#v}"
          python3 - <<'PY'
          import os, re, pathlib, sys

          ver = os.environ["VER"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"(?ms)^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text)
          if not m:
              sys.exit(f"✗ в CHANGELOG.md нет секции [{ver}]")
          section = m.group(1).strip("\n")

          blurb = """
          Самодостаточные сборки: интернет и сервер НЕ нужны — запись, распознавание
          нот, синтез и экспорт выполняются прямо на устройстве.

          **Android** — приложение (APK), работает полностью офлайн.
          **Web** — статический сайт: распакуйте и разверните на любом хостинге
          (nginx, Caddy, GitHub Pages, Cloudflare Pages). Запись микрофона
          требует HTTPS (или localhost).

          Контрольные суммы SHA-256 — в файле `SHA256SUMS.txt` в составе релиза.
          Android подписан стабильным ключом: SHA-256 сертификата — в README (раздел «Android»).
          """

          body = section + "\n\n---\n\n" + blurb.strip("\n") + "\n"
          pathlib.Path("release-notes.md").write_text(body, encoding="utf-8")
          print(f"✓ release-notes.md: секция [{ver}] + описание артефактов")
          PY

      - name: Скачать все артефакты
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum HumNote-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Создать релиз
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "HumNote ${{ github.ref_name }}"
          prerelease: true
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/**
